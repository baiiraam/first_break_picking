# ============================================================
# HALFMILE DATASET CONFIGURATION
# ============================================================
# This file overrides default.yaml for the Halfmile dataset.

dataset_name: "Halfmile"          # Changed from "default"

# ============================================================
# DATA PATHS - YOU MUST UPDATE THESE!
# ============================================================
hdf5_path: "data/raw/Halfmile3D_add_geom_sorted.hdf5"  # Path to HDF5 file
chunk_dir: "data/chunks"          # Where to save chunks

# ============================================================
# DATA PARAMETERS - CRITICAL! DO NOT CHANGE UNLESS YOU KNOW WHAT YOU'RE DOING!
# ============================================================
target_traces: 1578               # Matches Halfmile dataset
n_samples: 751                    # Matches Halfmile dataset
strip_width: 8                    # Can change this for experiments!
chunk_size: 69                    # Can change this to adjust memory usage
random_seed: 42

# ============================================================
# TRAIN/VAL/TEST SPLIT
# ============================================================
train_split: 0.8
val_split: 0.1
test_split: 0.1
force_reprocess: false            # Set to true to re-preprocess

# ============================================================
# TRAINING PARAMETERS - FREQUENTLY CHANGED
# ============================================================
batch_size: 4                     # Increase for faster training (if GPU memory allows)
learning_rate: 0.001              # Try 0.0001 if loss plateau
n_epochs: 2                      # Increase to 50 for better convergence
device: "mps"                     # "cpu", "cuda", or "mps"
num_workers: 0                    # Increase if you have more CPU cores
checkpoint_every: 1

# ============================================================
# GPU PARAMETERS
# ============================================================
multi_gpu: false
gpu_ids: null

# ============================================================
# LEARNING RATE SCHEDULER
# ============================================================
lr_scheduler: "plateau"
lr_patience: 3
lr_factor: 0.5
lr_step_size: 10
lr_gamma: 0.5
lr_T_max: 30

# ============================================================
# REGULARIZATION
# ============================================================
gradient_clip_value: 1.0

# ============================================================
# EARLY STOPPING
# ============================================================
early_stopping_patience: 5
early_stopping_min_delta: 0.0001

# ============================================================
# LOGGING
# ============================================================
tensorboard_log_dir: "runs"
mlflow_experiment_name: "seismic-fbp"
checkpoint_dir: "checkpoints"
log_dir: "logs"