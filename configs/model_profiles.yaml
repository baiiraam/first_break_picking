# ============================================================
# MODEL PROFILES
# ============================================================
# This file defines memory and performance profiles for all models.
# Used by check_device_memory.py and batch_train.py for auto-configuration.
#
# Fields:
#   params: Number of parameters
#   base_memory_mb: Base memory usage (model + overhead)
#   memory_per_batch_mb: Additional memory per batch item
#   memory_per_cache_mb: Additional memory per cached chunk
#   recommended_batch_size: Default batch size
#   recommended_cache_size: Default cache size
# ============================================================

