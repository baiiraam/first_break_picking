[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-fbp"
version = "1.0.0"
description = "Seismic First Break Picking with U-Net"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "h5py>=3.8.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.3.0",
    "tensorboard>=2.12.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
]
